name: GTA VI - V3 vrais extraits en mouvement (revue)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer FFmpeg et Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install 'Pillow>=10,<13'
      - name: Telecharger les clips officiels et monter une video de revue
        run: python clip-studio/gta6_real_motion_review.py
      - name: Archiver la video de revue et sa note sur les droits
        uses: actions/upload-artifact@v4
        with:
          name: gta6-real-motion-review-only
          path: |
            drafts/real_motion/gta_vi_real_motion_REVIEW_ONLY.mp4
            drafts/real_motion/RIGHTS_AND_SOURCES.txt
          retention-days: 1
          if-no-files-found: error
