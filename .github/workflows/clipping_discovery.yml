name: Twitch GTA VI - selection de clips
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rechercher les clips
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python clipping-bot/scripts/discover.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidats-clips-gta6
          path: clipping-bot/out/candidates.json
      - name: Actualiser le tableau public (liens uniquement, droits non confirmés)
        run: |
          python clip-studio/build_queue.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/clips.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh Twitch clip discovery queue'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
