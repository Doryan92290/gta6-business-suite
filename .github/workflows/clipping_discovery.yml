name: Twitch GTA VI - selection de clips
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rechercher les clips
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python clipping-bot/scripts/discover.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidats-clips-gta6
          path: clipping-bot/out/candidates.json
