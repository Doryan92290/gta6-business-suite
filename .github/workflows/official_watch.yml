name: Veille GTA VI
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6,14 * * *'
permissions:
  contents: write
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scanner les annonces Rockstar
        id: watch
        run: python automation/rockstar_watch.py
      - uses: actions/upload-artifact@v4
        with:
          name: veille-rockstar
          path: reports/official-watch.md
      - name: Sauvegarder les liens vus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/official_seen.json reports/official-watch.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update Rockstar watch'
            git push
          fi
      - name: Créer une tâche de vérification
        if: steps.watch.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title 'GTA VI : nouvelles sources à vérifier' --body-file reports/official-watch.md
