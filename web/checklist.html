<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checklist GTA VI — Guide Leonida</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a href="index.html" class="brand">GUIDE <b>LEONIDA</b></a><nav><a href="index.html">Accueil</a><a href="https://www.rockstargames.com/VI">Source officielle ↗</a></nav></header><main class="checklist"><p class="eyebrow">OUTIL INTERACTIF</p><h1>Ta checklist GTA VI</h1><p class="lead">Un suivi enregistré uniquement dans ton navigateur. Aucun compte ni achat requis.</p><p class="counter" id="counter">0 / 6</p><div class="progress"><div class="bar" id="bar"></div></div><div id="items"></div><button class="reset" id="reset">Réinitialiser</button></main><footer><span>Guide Leonida — non officiel</span><a href="index.html">Retour accueil</a></footer><script>
const tasks=["Vérifier les informations sur le site officiel Rockstar","Mettre à jour la console et vérifier l’espace disponible","Vérifier les paramètres de confidentialité du compte console","Activer les notifications des mises à jour officielles","Commencer une liste de découvertes sans spoilers","Noter les questions auxquelles tu veux trouver une réponse"];
const key="guide-leonida-checklist-v1";let done=[];try{done=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){done=[]}if(!Array.isArray(done))done=[];
function paint(){const box=document.getElementById("items");box.replaceChildren();tasks.forEach((task,i)=>{const lab=document.createElement("label");lab.className="task";const c=document.createElement("input");c.type="checkbox";c.checked=done.includes(i);c.addEventListener("change",()=>{done=c.checked?[...new Set([...done,i])]:done.filter(x=>x!==i);localStorage.setItem(key,JSON.stringify(done));paint()});const span=document.createElement("span");span.textContent=task;lab.append(c,span);box.append(lab)});document.getElementById("counter").textContent=done.length+" / "+tasks.length;document.getElementById("bar").style.width=(done.length/tasks.length*100)+"%"}paint();document.getElementById("reset").addEventListener("click",()=>{done=[];localStorage.removeItem(key);paint()});
</script></body></html>
